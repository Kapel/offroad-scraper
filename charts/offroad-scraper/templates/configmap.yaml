apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "offroad-scraper.configName" . }}
  labels:
    {{- include "offroad-scraper.labels" . | nindent 4 }}
data:
  # Rendered as a YAML mapping with a `sites:` list of site objects. Mounted at
  # /config/sites.yaml (subPath sites.yaml) by the scrape workload.
  sites.yaml: |
    sites:
{{- range .Values.sites }}
      - name: {{ .name | quote }}
        url: {{ .url | quote }}
        {{- if .note }}
        note: {{ .note | quote }}
        {{- end }}
        {{- if .mode }}
        mode: {{ .mode | quote }}
        {{- end }}
        {{- if .feedUrl }}
        feed_url: {{ .feedUrl | quote }}
        {{- end }}
        {{- if .maxDetailPages }}
        max_detail_pages: {{ .maxDetailPages }}
        {{- end }}
        {{- if .exclude }}
        exclude_paths: {{ toJson .exclude }}
        {{- end }}
{{- end }}
