{{- if eq .Values.secret.mode "values" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "offroad-scraper.secretName" . }}
  labels:
    {{- include "offroad-scraper.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.secret.values.deepseekApiKey | quote }}
  {{- if .Values.secret.values.icsAuthPassword }}
  ICS_AUTH_PASSWORD: {{ .Values.secret.values.icsAuthPassword | quote }}
  {{- end }}
  {{- if .Values.secret.values.subscriptionToken }}
  SUBSCRIPTION_TOKEN: {{ .Values.secret.values.subscriptionToken | quote }}
  {{- end }}
{{- end }}
