{{- if and (eq .Values.secret.mode "external") .Values.secret.external.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "offroad-scraper.secretName" . }}
  labels:
    {{- include "offroad-scraper.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.external.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secret.external.secretStoreRef.name | quote }}
    kind: {{ .Values.secret.external.secretStoreRef.kind | quote }}
  target:
    name: {{ include "offroad-scraper.secretName" . }}
  data:
    {{- range $appKey, $ref := .Values.secret.external.remoteRefs }}
    {{- if $ref.key }}
    - secretKey: {{ $appKey }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- if $ref.property }}
        property: {{ $ref.property | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
