name: Security Scan

on:
  schedule:
    # Every Monday at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan dependencies & image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit (Python dependencies)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=docker,dest=/tmp/offroad-scraper.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/offroad-scraper.tar
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "true"

      - name: Helm chart dependencies
        uses: azure/setup-helm@v5
        with:
          version: v3.12.3

      - name: Helm lint
        run: helm lint --strict charts/offroad-scraper
