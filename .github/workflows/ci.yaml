name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

      - name: Bandit
        run: bandit -r src

      - name: pip-audit
        run: pip-audit

  container-scan:
    name: Build & scan image
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          outputs: type=docker,dest=/tmp/offroad-scraper.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/offroad-scraper.tar
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "true"

  helm:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.3

      - name: Helm lint
        run: helm lint --strict charts/offroad-scraper

      - name: Helm template (default)
        run: helm template offroad-scraper charts/offroad-scraper --namespace offroad-scraper

      - name: Helm template (external secret mode)
        run: >-
          helm template offroad-scraper charts/offroad-scraper --namespace offroad-scraper
          --set secret.mode=external --set secret.external.enabled=true
          --set secret.external.secretStoreRef.name=demo-store
          --set secret.external.remoteRefs.DEEPSEEK_API_KEY.key=demo/offroad-scraper
