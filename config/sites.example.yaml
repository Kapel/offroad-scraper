# Example sites configuration for offroad-scraper.
#
# This file is a YAML mapping with a `sites:` list of site objects. Each site has:
#   name - a human-readable label
#   url  - the URL to scrape for events
#   note - an optional free-form note (ignored by the scraper)
#
# These entries are PLACEHOLDERS. Replace them with real event/calendar URLs
# before deploying. In the Helm chart this list is driven by `values.sites` and
# rendered into the ConfigMap mounted at /config/sites.yaml.
sites:
  - name: Example Offroad Park
    url: https://example.com/events
    note: Placeholder - replace with a real site

  - name: Another Offroad Club
    url: https://example.org/calendar
    note: Placeholder - replace with a real site
